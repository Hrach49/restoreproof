# The Cloud's local stack (C5.1). From cloud/:
#
#   docker compose up -d --wait          the whole stack; then GET http://127.0.0.1:8000/healthz
#   docker compose up -d --wait postgres only the database, for the tests
#
# Every credential in this file is local only: it protects nothing, the ports
# are published on 127.0.0.1 alone, and no deployment uses these values
# (docs/decisions.md 2026-10-10, C5.1 and C5.2, point 1). The app itself has
# no default for any of them.

name: restoreproof

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://restoreproof:local-only-postgres@postgres:5432/restoreproof
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: local-only-minio
  S3_SECRET_KEY: local-only-minio-secret
  S3_BUCKET: restoreproof
  SECRET_KEY: local-only-secret-key-not-for-any-deployment
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: restoreproof
      POSTGRES_PASSWORD: local-only-postgres
      POSTGRES_DB: restoreproof
    ports:
      # Not 5432: the dev laptop's own PostgreSQL service has it.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoreproof -d restoreproof"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO, built by Chainguard: MinIO publishes no community image any more
  # (docker.io/minio/minio and quay.io/minio/minio no longer pull). Chainguard's
  # free images have the `latest` tag only, so both are pinned by digest: this
  # one is RELEASE.2026-09-22T19-25-18Z. They carry no /bin/sh.
  minio:
    image: cgr.dev/chainguard/minio@sha256:6476f81b9739912fa9f50ceae2bb049a30336527cccd24beccfbeb4145f8f696
    command: ["server", "/data", "--console-address", ":9001"]
    # The image's user (65532) can't write a fresh named volume.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: local-only-minio
      MINIO_ROOT_PASSWORD: local-only-minio-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO's own readiness route, asked with bash alone (no curl in the image).
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3
          && [[ $$status == *" 200 "* ]]
      interval: 2s
      timeout: 3s
      retries: 30

  # One shot: makes the bucket, then exits 0.
  minio-bucket:
    image: cgr.dev/chainguard/minio-client@sha256:b0f5c2b2df15efb304bf8e752350d5549c06926cc981e1921a86188699606bfb
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://local-only-minio:local-only-minio-secret@minio:9000
      MC_CONFIG_DIR: /tmp/mc
    command: ["mb", "--ignore-existing", "local/restoreproof"]
    restart: "no"

  api:
    build: .
    image: restoreproof-cloud:local
    environment: *app-environment
    # The image's own command without --reload is what a deployment runs.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
        --no-access-log --reload --reload-dir app
    volumes:
      - ./app:/srv/app:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 5s
      retries: 20

  # The same image. The dispatcher is C5.9's; until then this only waits, and
  # it never migrates.
  scheduler:
    build: .
    image: restoreproof-cloud:local
    environment: *app-environment
    command: ["sh", "-c", "echo 'scheduler: the dispatcher is C5.9; nothing runs yet'; exec sleep infinity"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
