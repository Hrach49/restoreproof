# The Cloud's local stack (C5.1). From cloud/:
#
#   docker compose up -d --wait          the whole stack; then GET http://127.0.0.1:8000/healthz
#   docker compose up -d --wait postgres only the database, for the tests
#
# Every credential in this file is local only: it protects nothing, the ports
# are published on 127.0.0.1 alone, and no deployment uses these values
# (docs/decisions.md 2026-10-10, C5.1 and C5.2, point 1). The app itself has
# no default for any of them.

name: restoreproof

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://restoreproof:local-only-postgres@postgres:5432/restoreproof
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: local-only-minio
  S3_SECRET_KEY: local-only-minio-secret
  S3_BUCKET: restoreproof
  SECRET_KEY: local-only-secret-key-not-for-any-deployment
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: restoreproof
      POSTGRES_PASSWORD: local-only-postgres
      POSTGRES_DB: restoreproof
    ports:
      # Not 5432: the dev laptop's own PostgreSQL service has it.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoreproof -d restoreproof"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-only-minio
      MINIO_ROOT_PASSWORD: local-only-minio-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One shot: makes the bucket, then exits 0.
  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 local-only-minio local-only-minio-secret
        && mc mb --ignore-existing local/restoreproof
    restart: "no"

  api:
    build: .
    image: restoreproof-cloud:local
    environment: *app-environment
    # The image's own command without --reload is what a deployment runs.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
        --no-access-log --reload --reload-dir app
    volumes:
      - ./app:/srv/app:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 5s
      retries: 20

  # The same image. The dispatcher is C5.9's; until then this only waits, and
  # it never migrates.
  scheduler:
    image: restoreproof-cloud:local
    environment: *app-environment
    command: ["sh", "-c", "echo 'scheduler: the dispatcher is C5.9; nothing runs yet'; exec sleep infinity"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
