[project]
name = "restoreproof-cloud"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    # C5.7: the verifier (shared/tools/verify_bundle.py) imports asn1crypto and
    # cryptography; python-multipart is starlette's form parser.
    "asn1crypto>=1.5,<2",
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "cryptography>=50",
    "fastapi>=0.143.0",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mutmut>=3.8.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# One event loop for the whole session: asyncpg's connections belong to the loop
# that made them, and the test engine lives as long as the session.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs the test Postgres (TEST_DATABASE_URL; see docs/testing.md, \"Cloud\")",
]

# Used whenever coverage runs (`pytest --cov`, `coverage report`). The 80% gate
# is passed on the CI command line, not here or in addopts, so a local
# single-test run (`uv run pytest tests/test_x.py::name`) is never failed by it.
[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's asyncio layer runs the driver inside greenlets; without this the
# lines executed there are not counted.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true

# Mutation testing: `uv run mutmut run` from cloud/. mutmut 3 uses os.fork, so
# it runs on Linux/macOS/WSL only, not native Windows. Output goes to mutants/.
[tool.mutmut]
source_paths = ["app/"]
# alembic.ini: the migration tests read it beside app/ (tests/conftest.py).
also_copy = ["tools/", "alembic.ini"]
pytest_add_cli_args_test_selection = ["tests/"]
