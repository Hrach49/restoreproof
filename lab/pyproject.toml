[project]
name = "restoreproof-lab"
version = "0.0.0"
description = "Lab tools: seed and check the canary set (L1.2)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "msal>=1.31",
    "requests>=2.32",
]

# Readers used only by the tests, to prove every generated file opens. The
# generators themselves use the standard library only, so the committed bytes
# never depend on these libraries' versions.
[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pillow>=11",
    "pypdf>=5",
    "pytest>=8",
    "python-docx>=1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
