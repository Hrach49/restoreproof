[project]
name = "restoreproof-worker-install-tests"
version = "0.0.0"
description = "Tests of tools/worker-install (W7.1): the Worker installer, run through pwsh"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    # the fake rpworker's `graph certificate` opens the PFX New-WorkerGraphCertificate.ps1 made
    "cryptography>=42",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
markers = ["worker: needs the built Worker, worker/build/dev/rpworker.exe (CI deselects it with -m \"not worker\")"]
