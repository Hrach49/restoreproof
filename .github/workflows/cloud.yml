name: cloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Cloud tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    # The database tests run on a real PostgreSQL 16 and never on SQLite
    # (docs/decisions.md 2026-10-10, C5.1 and C5.2, point 2). They don't skip:
    # without this service they fail. The credentials are local only, the same
    # as cloud/docker-compose.yml's.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restoreproof
          POSTGRES_PASSWORD: local-only-postgres
          POSTGRES_DB: restoreproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U restoreproof -d restoreproof_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://restoreproof:local-only-postgres@127.0.0.1:5432/restoreproof_test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: cloud/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # Branch coverage is measured for the whole run, so the 80% total below is
      # coverage's combined line+branch figure (stricter than line-only). The
      # gate flags live here, not in pytest addopts, so a local single-test run
      # (`uv run pytest tests/test_x.py::name`) is never failed by them.
      - name: Test with coverage (80% floor on app/)
        run: >-
          uv run --locked pytest
          --cov=app --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=80

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('cloud/coverage.json') != '' }}
        run: |
          {
            echo "### Cloud coverage (app/, line + branch)"
            echo
            uv run --locked coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      # CLAUDE.md: 100% line + branch on app/auth, app/results.py, app/repo.
      # pytest-cov has only a global threshold, so a script checks these paths
      # (skipping any that don't exist yet) and appends its table to the summary.
      - name: Guarded paths at 100% line + branch
        if: ${{ !cancelled() && hashFiles('cloud/coverage.json') != '' }}
        run: uv run --locked python tools/check_coverage.py coverage.json --summary "$GITHUB_STEP_SUMMARY"

  # C5.1's Done-when: "docker compose up serves /healthz green". Builds the
  # image, starts the whole local stack (the api migrates before it listens)
  # and requires 200 with both checks ok.
  compose:
    name: Local stack serves /healthz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --wait --build

      - name: /healthz is 200 with db and s3 ok
        run: |
          body="$(curl --fail --silent --show-error http://127.0.0.1:8000/healthz)"
          echo "$body"
          test "$body" = '{"db":"ok","s3":"ok"}'

      - name: The stack's logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v
