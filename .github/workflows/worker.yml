name: worker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned OpenCppCoverage release installer (verified by SHA-256 before use).
  OPENCPPCOVERAGE_VERSION: 0.9.9.0
  OPENCPPCOVERAGE_SHA256: 2295A733DA39412C61E4F478677519DD0BB1893D88313CE56B468C9E50517888
  # Line-coverage floor for rpcore (CLAUDE.md "Coverage floors").
  RP_MIN_LINE_COVERAGE: 80

jobs:
  build-test:
    name: Worker build, test and coverage
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # vcpkg is pinned to the builtin-baseline in worker/vcpkg.json so the
      # tool and the port versions always match. Must run after the MSVC step:
      # vcvars sets VCPKG_ROOT to Visual Studio's bundled vcpkg.
      - name: Resolve vcpkg paths and commit
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "VCPKG_COMMIT=$baseline" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-cache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('worker/vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install vcpkg
        run: |
          git init $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      # Two builds in one job:
      #  - `ci` (Release) is what ships; tests run optimised to catch
      #    optimisation-only bugs. It stays cheap: vcpkg's x64-windows triplet
      #    builds Debug and Release libs anyway, so both presets share the same
      #    cached dependencies, and rpcore is small.
      #  - `coverage` (Debug, /Zi PDBs, no optimisation) is what OpenCppCoverage
      #    needs for accurate line data.
      # One job avoids paying the vcpkg/MSVC setup twice.
      - name: Configure (Release)
        run: cmake --preset ci

      - name: Build (Release)
        run: cmake --build --preset ci

      - name: Test (Release)
        run: ctest --preset ci

      # The shipped Release exe starts and reports project(VERSION). ctest
      # already checks this; the step puts the version in the job log. The
      # expected value comes from CMake's own cache, not from parsing
      # CMakeLists.txt.
      - name: rpworker --version (Release)
        run: |
          $entry = Select-String -Path build\ci\CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$'
          if (-not $entry) { throw "CMAKE_PROJECT_VERSION not found in build/ci/CMakeCache.txt" }
          $expected = $entry.Matches[0].Groups[1].Value
          $out = & .\build\ci\rpworker.exe --version
          if ($LASTEXITCODE -ne 0) { throw "rpworker --version exited with $LASTEXITCODE" }
          if ("$out".Trim() -ne $expected) { throw "rpworker --version printed '$out', expected '$expected'" }
          "rpworker --version: $out"

      - name: Coverage gate self-tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Install OpenCppCoverage
        run: |
          $url = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-$env:OPENCPPCOVERAGE_VERSION/OpenCppCoverageSetup-x64-$env:OPENCPPCOVERAGE_VERSION.exe"
          $installer = "$env:RUNNER_TEMP\OpenCppCoverageSetup.exe"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:OPENCPPCOVERAGE_SHA256) { throw "OpenCppCoverage installer hash mismatch: $hash" }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          $dir = "$env:ProgramFiles\OpenCppCoverage"
          if (-not (Test-Path "$dir\OpenCppCoverage.exe")) { throw "OpenCppCoverage not installed in $dir" }
          $dir >> $env:GITHUB_PATH

      - name: Configure (coverage)
        run: cmake --preset coverage

      - name: Build (coverage)
        run: cmake --build --preset coverage

      # --cover_children follows ctest into each rptests.exe process and, via
      # tests/run_exe_test.cmake, into each rpworker.exe run. --sources limits
      # the report to rpcore (src/, include/) and rpworker's main() (app/), so
      # tests, Catch2 and the STL don't count. OpenCppCoverage returns the exit
      # code of ctest, so a failing test fails this step.
      - name: Test under OpenCppCoverage
        run: |
          OpenCppCoverage --quiet --cover_children `
            --sources "$PWD\src" --sources "$PWD\include" --sources "$PWD\app" `
            --export_type "cobertura:$PWD\build\coverage\coverage.xml" `
            -- ctest --preset coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Fails below RP_MIN_LINE_COVERAGE, below 100% line coverage on
      # vault/signer/target_guard once those files exist, and on any .cpp
      # under src/, include/ or app/ that is missing from the report (--root
      # lists them from disk: an rpcore file no test uses never reaches
      # rptests.exe).
      # OpenCppCoverage has no branch data, so the required 100% *branch*
      # coverage on those files is only approximated by 100% line coverage
      # (see tools/coverage_gate.py). Writes a table to the job summary.
      - name: Coverage gate
        run: python tools/coverage_gate.py build/coverage/coverage.xml --root . --min-line $env:RP_MIN_LINE_COVERAGE --summary $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: worker-coverage-cobertura
          path: worker/build/coverage/coverage.xml
          if-no-files-found: warn
