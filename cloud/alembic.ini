# Alembic's configuration (C5.2). Run from cloud/:
#
#   uv run alembic upgrade head
#
# No database URL lives here: app/migrations/env.py takes it from the
# DATABASE_URL environment variable. Logging is the app's own JSON logging
# when the app runs; this file configures none.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s
path_separator = os
# 0002_<slug>.py and so on; the revision IDs are the numbers.
file_template = %%(rev)s_%%(slug)s
